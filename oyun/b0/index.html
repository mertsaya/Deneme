<style>
/* B0 gri kutu: tek dosya, Canvas2D, bağımlılıksız. Şartname: oyun/b0/TASARIM.md */
:root{
  --gok:#8cc8f0; --koyu:#0d1630; --panel:rgba(16,24,48,.78); --cizgi:rgba(255,255,255,.22);
  --yazi-r:#f4f7ff; --soluk:#b7c3dd; --sari:#ffd23f; --yesil:#3ddc84; --kirmizi:#ff5a5a; --turkuaz:#2ee6d6; --pembe:#ff7eb6;
  --yazi:1; color-scheme:dark;
}
html{font-size:calc(16px * var(--yazi))}
html,body{height:100%;margin:0;background:var(--koyu);color:var(--yazi-r);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.kontur{text-shadow:0 0 2px #000,0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;min-width:48px;min-height:48px;border-radius:14px;border:2px solid var(--cizgi);background:var(--panel)}
button:focus-visible{outline:3px solid var(--sari);outline-offset:2px}
button:disabled{opacity:.45}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none}
.ust{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kutu{background:var(--panel);border:1px solid var(--cizgi);border-radius:999px;padding:6px 12px;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
#jeton i{display:inline-block;width:.9em;height:.9em;border-radius:50%;background:var(--sari);border:2px solid #b8860b;vertical-align:-2px;margin-right:6px}
#mesafe small{font-weight:500;color:var(--soluk)}
#durBtn{pointer-events:auto;width:56px;height:56px;font-size:1.2rem;font-weight:800;flex:none}
#irtifa{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 90px);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:14px;border-radius:7px;background:rgba(16,24,48,.55);border:1px solid var(--cizgi)}
#irtifa i{position:absolute;left:-5px;right:-5px;height:6px;border-radius:3px;background:var(--sari);bottom:0;transform:translateY(50%)}
#irtifa span{position:absolute;right:20px;transform:translateY(50%);font-size:.85rem;font-weight:700;white-space:nowrap}
#irtifa b{position:absolute;right:20px;font-size:.8rem;color:var(--soluk);font-weight:500}
#hizg{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:132px;height:132px}
#hizg.titre{animation:titre .08s linear infinite}
@keyframes titre{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
#dalisd{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:88px;height:88px}
#dalisd.salla{animation:salla .08s linear}
@keyframes salla{0%,100%{transform:translateX(0)}33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
#mesaj{position:fixed;left:12px;right:12px;top:30%;text-align:center;font-weight:900;font-size:2.1rem;letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .2s}
#mesaj.on{opacity:1}
#mesaj small{display:block;font-size:1.2rem;font-weight:800;color:var(--sari)}
#ipucu{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#ipucu span{display:inline-block;background:var(--panel);border:1px solid var(--cizgi);border-radius:999px;padding:8px 16px;font-weight:700;font-size:1.05rem}
#ipucu.on{opacity:1}
body.rampada #ipucu{bottom:calc(env(safe-area-inset-bottom,0px) + 43% + 40vw + 12px)}
#rampa{position:fixed;left:15%;right:15%;bottom:calc(env(safe-area-inset-bottom,0px) + 43%);pointer-events:none}
#rampa svg{width:100%;height:auto;display:block}
#rampa.titre{animation:titre .06s linear 5}
/* ekranlar */
.ekran{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-sizing:border-box;gap:10px;overflow-y:auto;touch-action:pan-y}
.koyu{background:rgba(9,14,32,.9)}
.ekran h1{margin:0;font-size:1.6rem;font-weight:900;letter-spacing:.03em}
.ekran h2{margin:0;font-size:1.05rem;color:var(--soluk);font-weight:700}
.birincil{background:var(--sari);color:#1d1600;border-color:#b8860b;font-weight:900;font-size:clamp(1rem,1.4rem,6vw);padding:12px 14px;min-height:64px;white-space:nowrap}
.ikincil{font-weight:800;font-size:clamp(.9rem,1.05rem,4.6vw);padding:10px 12px;white-space:nowrap}
.ekran>*{flex-shrink:0}
#aKapat{position:sticky;bottom:0;margin-top:auto;box-shadow:0 0 0 8px rgba(9,14,32,.97),0 14px 0 8px rgba(9,14,32,.97)}   /* içerik sıkışmaz; ekran kaydırılır */
.ekran>.alt{position:sticky;bottom:0;margin-top:auto;padding-top:8px;background:rgba(9,14,32,.97);box-shadow:0 14px 0 rgba(9,14,32,.97);flex:none}
/* hangar */
#hangar .tepe{display:flex;justify-content:space-between;align-items:center}
#hJeton{font-size:1.4rem}
#hRoket{flex:1 0 110px;min-height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#hRoket svg{height:100%;max-height:220px;width:auto}
#hangar{gap:8px}
#kartlar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kart{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:3px;padding:7px 8px;border-radius:14px;background:#26314f;border:2px solid #44527a}
.kart b{font-size:.95rem;line-height:1.15}
.kart p{margin:0;font-size:max(13px,.72rem);color:var(--soluk);line-height:1.25;flex:1}
.kart .sv{display:flex;gap:3px;flex-wrap:wrap}
.kart .sv i{width:9px;height:9px;border-radius:50%;background:#55607e}
.kart .sv i.d{background:var(--sari)}
.kart .fiyat{font-weight:900;font-size:.95rem;padding:4px 6px;border-radius:10px;background:var(--sari);color:#1d1600;text-align:center}
.kart.yetersiz{opacity:.6}
.kart.yetersiz .fiyat{background:#55607e;color:#e0e6f5}
.kart.maks .fiyat{background:#2b8a57;color:#fff}
.kart.vurgu{border-color:var(--turkuaz);box-shadow:0 0 0 3px rgba(46,230,214,.35)}
.kart.zipla{animation:zipla .12s ease-out}
@keyframes zipla{50%{transform:scale(1.15)}}
.alt{display:flex;gap:10px;align-items:stretch}
.alt .birincil{flex:1}
#dislibtn{width:64px;font-size:1.6rem}
/* kara kutu */
#karakutu{gap:8px}
#kkToplam{font-size:2.6rem;font-weight:900;color:var(--sari);font-variant-numeric:tabular-nums}
.dokum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:1rem;background:var(--panel);border-radius:14px;padding:10px 14px}
.dokum span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.dokum .yeni{color:var(--yesil);font-weight:900;margin-left:6px}
.satir{opacity:0;transition:opacity .2s}
.satir.on{opacity:1}
#kkDurduran{background:#3a2a10;border:2px solid #7a5a1a;border-radius:14px;padding:10px 14px;font-size:1rem;line-height:1.35}
#kkDurduran b{display:block;font-size:.8rem;color:var(--sari);letter-spacing:.06em;margin-bottom:2px}
#kkKart{text-align:left;padding:10px 14px;background:#1d3a3a;border-color:var(--turkuaz);min-height:64px}
#kkKart small{display:block;color:var(--soluk)}
/* menü ve ayarlar */
.orta{justify-content:center;align-items:stretch;max-width:26rem;margin:0 auto;right:0;left:0}
.orta button{min-height:56px;font-weight:800;font-size:1.15rem}
#mTohum{font-size:.8rem;color:var(--soluk);text-align:center;user-select:text;-webkit-user-select:text}
.ayar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;background:var(--panel);border-radius:12px;padding:8px 12px;min-height:52px}
.ayar label{font-weight:700}
.ayar input[type=range]{width:45%;min-height:48px}
.secim{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.secim button{min-width:48px;padding:4px 8px;font-size:.85rem;font-weight:700}
.secim button[aria-pressed=true]{background:var(--sari);color:#1d1600}
#sayim{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:6rem;font-weight:900;pointer-events:none}
#bildirim{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 80px);text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#bildirim span{display:inline-block;background:#1d3a3a;border:1px solid var(--turkuaz);border-radius:12px;padding:8px 14px;font-weight:700}
#bildirim.on{opacity:1}
#yatay{position:fixed;inset:0;background:var(--koyu);display:none;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;z-index:9}
@media (orientation:landscape) and (pointer:coarse){#yatay{display:flex}}
#test{position:fixed;left:8px;right:8px;bottom:8px;font:12px/1.4 ui-monospace,monospace;background:rgba(0,0,0,.7);padding:8px;border-radius:8px;white-space:pre-wrap;max-height:40%;overflow:auto;user-select:text;-webkit-user-select:text;touch-action:pan-y}
</style>
</head>

function RNG(seed) {

}

// ================================================================== nesne havuzu (uçuşta new yok)
class Nesne {
  constructor() { this.g = { ox: 0, oy: 0, kvx: 0, kvy: 0, kt: 9, ezil_t: 9, bas_t: 9, ezx: 0, ezy: 0, donus: 0, faz: 0, sonuk: 0 }; this.sifirla('', 0, 0, '', 0, 0); }
  sifirla(tip, x, y, sinif, r, dogus) {
    this.tip = tip; this.x = x; this.y = y; this.sinif = sinif; this.r = r; this.vurus = 0; this.son_t = -99; this.aktif = true; this.dogus = dogus;
    this.kimlik = ++KIMLIK; this.halka_oldu = false;
    const g = this.g; g.ox = g.oy = g.kvx = g.kvy = 0; g.kt = 9; g.ezil_t = 9; g.bas_t = 9; g.donus = 0; g.faz = (this.kimlik * 2.399) % 6.283; g.sonuk = 0;
  }

let KIMLIK = 0;
const HAVUZ = [];
for (let i = 0; i < 160; i++) HAVUZ.push(new Nesne());
function nesneAl(tip, x, y, sinif, r, dogus) { const o = HAVUZ.length ? HAVUZ.pop() : new Nesne(); o.sifirla(tip, x, y, sinif, r, dogus); return o; }

// ================================================================== uçuş (sim Ucus sınıfının B0 dalları; aynı adlar, aynı sıra)
class Ucus {

    this.kay = op.kay || 0;                         // görüntülü oyunda zemin payı (W oranı); görüntüsüzde 0 = sim ekran()

    this.denetim = !!op.denetim;
    const tl = op.tipler || B0.tipler;
    this.tipSira = Object.keys(TIPLER).filter(k => tl.includes(k));   // sim anahtar sırası
    this.t = 0; this.rampa_t = 0;
    this.nesneler = []; this.aday = []; this.olay = []; this.bitti = null;
    this.st = { sekme: 0, mukemmel: 0, temas: 0, son_sans: 0, dalis: 0, max_v: 0, max_y: 0, kazanc: 0, vay_t: null, ekran_n: 0, ekran_ornek: 0, ekran_min: 99, ekran_az: 0,
      kademe_yuk: [], mesafe_g: 0, firsat: 0, firsat_tut: 0, kademe_kalan: 0, garanti: 0, km_bant: 0, kazanc_rakip: 0, ip: 0 };
    this.duvar = new Set();
    this.kombo_n = 0; this.kombo_t = -99; this.kombo_c = 1;
    this.ses_t = 0; this.dur_t = 0;
    this.gosterge = A.gosterge_bas; this.dalis_t = null;
    this.bos = false; this.bos_k = 0; this.bos_a = 0; this.bos_v = 0;
    this.kademe = 1 + (sv.kademe_n || 0) + B0.kademe_n;
    this.cd_kat = 1;
    this.firsat_zaman = {}; this.son_firsat_t = -99; this.firsat_n = 0;
    this.rng.random();                              // sim __init__: olumcul_zaman çekimi (B0'da ölümcül yok; çekim sırası korunur)
    this.yon_t = 0; this.garanti_t = 0; this.cam_v = 0;
    this.x = 0; this.y = A.rampa_y; this.vx = 0; this.vy = 0; this.px = 0; this.py = A.rampa_y;
    this.tepe_rampa = A.rampa_y; this.kad_izle = null; this.kad_y0 = 0;
    this.E = new Float64Array(6); this.RN = new Float64Array(2);
    this.rx = new Float64Array(80); this.ry = new Float64Array(80); this.ai = new Int32Array(80);

  }
  emit(ad, a, b, c) { if (this.ol) this.ol(ad, a, b, c); }
  log(...a) { this.olay.push([Math.round(this.t * 100) / 100, ...a]); }
  ekran() {
    const W = Math.min(A.ekran_wmax, A.ekran_w0 + A.ekran_wk * this.cam_v), H = W * A.ekran_oran, Hg = W * this.oran, E = this.E;

    return E;
  }
  acik(tip) { return this.tipSira.includes(tip) && this.tur >= TIPLER[tip].acilis; }
  k_etkin(k) { return Math.min(A.k_tavan, k + A.k_sv * (this.sv.verim || 0)); }
  bant() { let k = 1; for (const [y0, c] of A.bant_carpan) if (this.y >= y0) k = c; return k; }
  odul(miktar, kombo = true, o = null) {
    if (kombo) {

  seyrek(y) {

  b0k() {   // B0 ek seyrekleşmesi (K6; sim'de yok): roket alçak banttayken t0–t1 arasında yoğunluk ve garanti doğrusal olarak en_az'a iner

  tip_sec(y, sadece_tr = false) {

function dokunus() {

// ---- ana döngü

}
function guncelle(dt) {
  // efekt sayaçları (gerçek zaman)
  if (mesajZ > 0 && (mesajZ -= dt) <= 0) $('mesaj').classList.remove('on');
  if (ipucuZ > 0 && (ipucuZ -= dt) <= 0) $('ipucu').classList.remove('on');
  if (bildirimZ > 0 && (bildirimZ -= dt) <= 0) $('bildirim').classList.remove('on');

  for (const h of G.halkaG) if (h.on && (h.t += dt) > h.s) h.on = false;

  for (const p of G.kademeP) if (p.on) { p.t += dt; p.vy = Math.max(p.t > 0.4 ? -12 : -80, p.vy - 30 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.a += dt * (p.t > 0.4 ? 0.3 : 3); if (p.y < -10 || p.t > 8) p.on = false; }

  if (u) for (const o of u.nesneler) {   // görsel ofsetler (§5) ve ezilme
    const g = o.g, Y = B0_ARAYUZ.yan_kayma;
    g.ezil_t += dt; g.bas_t += dt;
    if (g.kt < Y.sure) { const f = Math.exp(-g.kt / (Y.sure / 3)); g.ox += g.kvx * f * dt; g.oy += g.kvy * f * dt; g.kt += dt; }
    else if (o.aktif && (g.ox || g.oy)) { const f = Math.exp(-dt / (Y.donus / 4)); g.ox *= f; g.oy *= f; if (Math.abs(g.ox) + Math.abs(g.oy) < 0.01) g.ox = g.oy = 0; }

      if (dt > 0 && G.slowT > 0) { olcek = G.slowK; G.slowT -= dt; }

      let n = 0;
      while (G.hitstop <= 0 && G.acc >= DT && n < 40 * HIZ) {
        fizikAdim(); G.acc -= DT; n++;
        if (u.bitti || G.hitstop > 0) break;
      }
      if (G.acc > DT * 4) G.acc = DT * 4;
      // vurgu ve dalış ipucu (10 Hz yeterli)
      if ((G.vurguT -= dt) <= 0) {
        G.vurguT = 0.1;
        G.vurguO = u.gosterge >= 1 && u.dalis_t === null ? u.dalis_hedef() : null;
        if (G.vurguO && !G.bot && !KAYIT.k.ipucu.dalis && !G.hedefIpucu) { G.hedefIpucu = true; ipucu('Dalış için dokun'); KAYIT.k.ipucu.dalis = true; KAYIT.yaz(); }
      }

    }

let son = 0, fpsN = 0, fpsT = 0;
function kare(zaman) {

}
