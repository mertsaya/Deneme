<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plüton Görsel Dilim</title>
<meta name="description" content="Son Durak: Plüton — B1 görsel dilimi: çizgi film sprite'larıyla kendi kendine oynayan gösterim sahnesi.">
<link rel="icon" href="data:,">
<style>
:root { --gece: #0d1538; }
html, body { margin: 0; height: 100%; background: var(--gece); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" aria-label="Roket gösterim sahnesi. Dokununca roket kısa dalış yapar."></canvas>
<script>
'use strict';
// Son Durak: Plüton — B1 görsel dilimi. Gösterim sahnesi (oyun fiziği DEĞİL; B0 ölçüleri ve kamera formülüyle).
// Sprite'lar sprite/atlas.json + atlas_*.png (uretim/uret.py ile üretilir). Dünya: y yukarı, birim = B0 birimi.
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let CW = 384, CH = 832, DPR = 1;
const AZ = matchMedia('(prefers-reduced-motion: reduce)').matches;   // hareket azaltma: sarsıntı ve parlama yok
function boyut() {
  const w = innerWidth, h = innerHeight;
  CH = h; CW = Math.min(w, Math.round(h * 0.6));
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  cv.style.width = CW + 'px'; cv.style.height = CH + 'px';
}
addEventListener('resize', boyut); boyut();

// ------------------------------------------------------------------ atlas
let ATL = null, IMG = [];
async function yukle() {
  const j = await (await fetch('sprite/atlas.json')).json();
  IMG = await Promise.all(j.sayfalar.map(s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('yüklenemedi: ' + s)); i.src = 'sprite/' + s; })));
  ATL = j;
}
// ad: sprite; X,Y: ekran (CSS px); rot: ekran açısı (saat yönü +); k: CSS px / dünya birimi; sx,sy: yerel ezilme
function spr(ad, X, Y, rot, k, sx = 1, sy = 1, a = 1) {
  const s = ATL.sprite[ad]; if (!s || a <= 0.01) return;
  const f = DPR * k / s[7], c = Math.cos(rot), n = Math.sin(rot);
  cx.setTransform(f * c * sx, f * n * sx, -f * n * sy, f * c * sy, DPR * X, DPR * Y);
  cx.globalAlpha = Math.min(1, a);
  cx.drawImage(IMG[s[0]], s[1], s[2], s[3], s[4], -s[5], -s[6], s[3], s[4]);
}

// ------------------------------------------------------------------ yardımcılar
let tohum = 1;
const rnd = () => { tohum = (tohum * 16807) % 2147483647; return (tohum - 1) / 2147483646; };
const hash = (i, j) => { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const rad = d => d * Math.PI / 180, lerp = (a, b, t) => a + (b - a) * t, kis = (v, a, b) => Math.max(a, Math.min(b, v));
function renkKaris(a, b, t) { const p = (h, i) => parseInt(h.slice(1 + i * 2, 3 + i * 2), 16); return `rgb(${[0, 1, 2].map(i => Math.round(p(a, i) + (p(b, i) - p(a, i)) * t)).join(',')})`; }

// ------------------------------------------------------------------ sabitler (B0 ile aynı ölçek)
const G = 30, R_ROKET = 4, RAMPA_Y = 60, RAMPA_ACI = 38, SES_V = 115;
const TIP = { balon: { r: 12, aci: 52, k: 0.95 }, zeplin: { r: 22, aci: 48, k: 1.0 }, marti: { r: 13 }, ucurtma: { r: 7 }, dron: { r: 9 } };
const NOZUL = { 2: -20.3, 1: -6.9 };

// ------------------------------------------------------------------ durum
let S;   // sahne durumu
function sifirla() {
  tohum = 20261008;
  S = {
    t: 0, faz: 'rampa', zaman: 1, yavasT: 9, solma: 1, solmaHedef: 0,
    R: { x: 0, y: 0, vx: 0, vy: 0, ang: rad(RAMPA_ACI), kademe: 2, dalis: 0, guc: 0, ifade: 'notr', ifT: 0, ez: 9, yol: -45, sesKirildi: false, iz: [] },
    nesne: [], parca: [], yazi: [], halka: [],
    sira: ['ucurtma', 'zeplin', 'balon', 'marti', 'dalis', 'dron', 'son'], adim: 0, hedef: null, olaylar: [],
    K: { x: 0, y: 0, s: 1.9, W: 200, v: 60, sars: 0, ox: 0, oy: 0 }, cdt: 0, flas: 9, konT: 9, sonDokun: -9, apexT: null, dekorX: 120,
    portreT: 9, sesT: 9, jeton: 0,
  };
  rampaKonum();
  kameraGuncelle(1, true); S.K0 = S.K.y;
}
function olay(ad) { S.olaylar.push({ ad, t: +S.t.toFixed(3) }); }
function ifade(f, sure = 1.0) { if (S.R.ifade !== f) S.portreT = 0; S.R.ifade = f; S.R.ifT = sure; }

// ------------------------------------------------------------------ rampa
const RAY = { x0: -76.8, y0: 0, x1: 0, y1: RAMPA_Y };
function rampaKonum() {
  const R = S.R, a = rad(RAMPA_ACI), L = Math.hypot(RAY.x1 - RAY.x0, RAY.y1 - RAY.y0);
  const d = L + R.yol;   // yol: tepeden geri uzaklık (negatif)
  R.x = RAY.x0 + Math.cos(a) * d - Math.sin(a) * 4.6; R.y = RAY.y0 + Math.sin(a) * d + Math.cos(a) * 4.6; R.ang = a;
}

// ------------------------------------------------------------------ yörünge tahmini (yönetmen için)
function tahmin(T, kosul) {
  const R = S.R; let x = R.x, y = R.y, vx = R.vx, vy = R.vy, dal = R.dalis; const dt = 1 / 60;
  let apex = y;
  for (let t = 0; t < T; t += dt) {
    if (dal > 0) { vx += 40 * dt; vy -= 150 * dt; dal -= dt; }
    vy -= G * dt; x += vx * dt; y += vy * dt; apex = Math.max(apex, y);
    if (kosul && kosul(t, x, y, vx, vy, apex)) return { t, x, y, vx, vy, apex };
  }
  return { t: T, x, y, vx, vy, apex };
}
function nesneEkle(tip, x, y, ek = {}) {
  const o = { tip, x, y, r: TIP[tip].r, t0: S.t, vurus: 0, hitT: 9, aktif: true, faz: rnd() * 6.28, gorunT: 0, ...ek };
  if (tip === 'marti') o.kuslar = [[-6, 3, 0], [5, -4, 1.7], [1.5, 6.5, 3.1]].map(([dx, dy, f]) => ({ dx, dy, f, vx: 0, vy: 0, rot: 0, vr: 0 }));
  if (tip === 'ucurtma') { o.ipX = x - 18; o.kopT = null; o.vx = 0; o.vy = 0; o.rot = 0; }
  if (tip === 'dron') { o.halka = 1; o.bidonT = null; }
  S.nesne.push(o); return o;
}

// ------------------------------------------------------------------ yönetmen: sıradaki olayın nesnesini rotaya koyar
function yonet() {
  const R = S.R, ad = S.sira[S.adim];
  if (S.faz !== 'ucus' || !ad) return;
  if (S.hedef) {   // kaçırıldı mı?
    const o = S.hedef;
    if (R.x > o.x + o.r + 40 || (R.y < o.y - 120 && R.vy < 0 && o.tip !== 'ucurtma')) { S.hedef = null; S.adim++; }
    return;
  }
  if (ad === 'ucurtma') {
    const P = tahmin(1.1); S.hedef = nesneEkle('ucurtma', P.x, P.y + 24);
  } else if (ad === 'zeplin' || ad === 'balon') {
    if (R.vy < -10) return;   // yükselirken yerleştir (ekran dışında kalsın)
    const P0 = tahmin(8), hedefY = Math.max(ad === 'zeplin' ? 95 : 90, P0.apex - (ad === 'zeplin' ? 75 : 60));
    const P = tahmin(8, (t, x, y, vx, vy) => t > 1.2 && vy < 0 && y <= hedefY);
    S.hedef = nesneEkle(ad, P.x + 1.5, P.y - (TIP[ad].r + R_ROKET) + 1.5);
  } else if (ad === 'marti') {
    const P = tahmin(1.5); S.hedef = nesneEkle('marti', P.x, P.y + 1);
  } else if (ad === 'dalis') {
    if (R.vy < 0 && S.t - S.sonDokun > 1.0 && R.y > 70) { dalis(true); }
  } else if (ad === 'dron') {
    const P = tahmin(1.6); S.hedef = nesneEkle('dron', P.x, P.y + 1);
  } else if (ad === 'son') {
    if (R.vy < 0 && R.kademe === 2 && (R.y < 45 || S.t - (S.dronT ?? S.t) > 2.6)) sonSans();
  }
}
function sonraki() { S.hedef = null; S.adim++; }

// ------------------------------------------------------------------ dekor nesneleri (rotadan uzak; gökyüzünü doldurur)
function dekor() {
  const K = S.K, sag = K.x + K.W * 0.67 + 40; let yol = null;
  while (S.dekorX < sag + 200) {
    S.dekorX += 70 + rnd() * 90;
    const y = 40 + rnd() * Math.max(120, K.y + 250);
    const tip = y < 150 && rnd() < 0.3 ? 'ucurtma' : rnd() < 0.45 ? 'balon' : rnd() < 0.6 ? 'marti' : 'zeplin';
    if (!yol) { yol = []; tahmin(4, (t, x, y) => { yol.push(x, y); return false; }); }
    let uzak = true;
    for (let i = 0; i < yol.length; i += 6) if (Math.hypot(yol[i] - S.dekorX, yol[i + 1] - y) < TIP[tip].r + 45) { uzak = false; break; }
    if (S.hedef && Math.hypot(S.hedef.x - S.dekorX, S.hedef.y - y) < S.hedef.r + TIP[tip].r + 30) uzak = false;
    if (uzak && S.dekorX > K.x + K.W * 0.67 + 20) nesneEkle(tip, S.dekorX, y, { dekor: true });
  }
  S.nesne = S.nesne.filter(o => o.x > K.x - K.W * 0.5 - 80 || (o.tip === 'ucurtma' && o.kopT !== null && S.t - o.kopT < 2));
}

// ------------------------------------------------------------------ eylemler
function dalis(oto) {
  const R = S.R; if (S.faz !== 'ucus' || R.dalis > 0) return;
  R.dalis = 0.5; R.vy = Math.min(R.vy, -30); R.guc = 0.5; ifade('kararli', 0.9);
  olay(oto ? 'dalis_oto' : 'dalis_dokunus');
  if (S.sira[S.adim] === 'dalis') {   // dalış rotasına sekme balonu (mükemmel sekme + patlama)
    const P = tahmin(0.9);
    S.hedef = nesneEkle('balon', P.x + 2, P.y - (12 + R_ROKET) + 1, { patlar: true });
    S.adim++;   // sıradaki: dron (balona sekince)
    S.dalisBalon = S.hedef; S.hedef = null; S.adim = S.sira.indexOf('dron'); S.dronBekle = true;
  }
}
function sonSans() {
  const R = S.R; olay('kademe_ayrilma');
  R.kademe = 1; S.faz = 'son'; S.sonT = S.t;
  const a = R.ang;
  S.parca.push({ ad: 'roket_alt', x: R.x, y: R.y, vx: R.vx * 0.3, vy: 10, rot: -a, vr: 1.4, t: 0, omur: 4, k: 1, a: 1, g: 22, kademe: true });
  R.vy = 235; R.vx = Math.max(60, R.vx * 0.8); R.guc = 1.4; ifade('saskin', 0.7);
  S.ifSonra = 'kararli';
  for (let i = 0; i < 6; i++) toz(R.x - 14, R.y, rnd() * 6.28, 30 + rnd() * 30, 0.7);
  yazi('SON ŞANS!', R.x, R.y + 18, '#ffd23f');
}

// ------------------------------------------------------------------ efektler
function parca(o) { S.parca.push(Object.assign({ t: 0, vr: 0, rot: 0, k: 1, k2: null, a: 1, g: 0, vx: 0, vy: 0 }, o)); }
function toz(x, y, yon, hiz, k = 1) { parca({ ad: 'toz', kareler: 4, x, y, vx: Math.cos(yon) * hiz, vy: Math.sin(yon) * hiz, omur: 0.55, k: k * 0.7, k2: k * 1.15, a: 0.95, suruk: 3 }); }
function yildiz(x, y, k = 1) { parca({ ad: 'yildiz', kareler: 3, x, y, omur: 0.32, k: k * 0.9, k2: k * 1.3 }); for (let i = 0; i < 6; i++) { const a = rnd() * 6.28, v = 40 + rnd() * 40; parca({ ad: 'parilti', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, omur: 0.5 + rnd() * 0.3, k: 0.8 + rnd() * 0.6, k2: 0.2, vr: 6, suruk: 2.5 }); } }
function yazi(m, x, y, renk = '#fff', boy = 1) { S.yazi.push({ m, x, y, t: 0, renk, boy }); }
function sars(a) { if (!AZ) S.K.sars = Math.max(S.K.sars, a); }

function sekme(o) {
  const R = S.R, T = TIP[o.tip]; o.vurus++; o.hitT = 0; R.ez = 0;
  const v = Math.hypot(R.vx, R.vy), mukemmel = R.dalis > 0 || o.patlar;
  const hiz = Math.max(v * T.k * (mukemmel ? 1.12 : 1), 100), a = rad(T.aci + (mukemmel ? 4 : 0));
  R.vx = hiz * Math.cos(a); R.vy = hiz * Math.sin(a); R.dalis = 0;
  const cx_ = R.x, cy_ = o.y + o.r * (o.tip === 'zeplin' ? 0.95 : 0.9);
  for (let i = 0; i < 5; i++) toz(cx_ + (i - 2) * 3, cy_, Math.PI * (i < 2 ? 1 : 0) + (rnd() - 0.5) * 0.6, 25 + rnd() * 25, 0.9);
  yildiz(cx_, cy_ + 2, mukemmel ? 1.3 : 1);
  sars(mukemmel ? 0.6 : 0.35);
  ifade('heyecan', 1.1);
  yazi(mukemmel ? 'MÜKEMMEL!' : '+' + (o.tip === 'zeplin' ? 40 : 15), R.x, R.y + 14, mukemmel ? '#ffd23f' : '#fff', mukemmel ? 1.2 : 1);
  jetonlar(R.x, R.y, mukemmel ? 5 : 3);
  if (o.patlar) {
    o.aktif = false;
    for (let i = 0; i < 12; i++) { const b = rnd() * 6.28, s = 40 + rnd() * 50; parca({ ad: 'balon_parca', x: o.x + Math.cos(b) * 8, y: o.y + Math.sin(b) * 8, vx: Math.cos(b) * s, vy: Math.sin(b) * s + 20, vr: (rnd() - 0.5) * 14, rot: b, omur: 0.9, k: 1.2, g: 50, suruk: 1.5 }); }
    yildiz(o.x, o.y, 1.6);
  }
  olay('sekme_' + o.tip + (mukemmel ? '_mukemmel' : ''));
}
function jetonlar(x, y, n) { for (let i = 0; i < n; i++) parca({ ad: 'jeton', x, y, vx: (rnd() - 0.5) * 70, vy: 30 + rnd() * 50, g: 0, suruk: 3, omur: 0.75 + i * 0.05, k: 1.1, vr: 0, jeton: true }); S.jeton += n * 5; }

// ------------------------------------------------------------------ fizik adımı (sabit 1/120 s)
function adim(dt) {
  S.t += dt;
  const R = S.R;
  R.ez += dt; R.guc = Math.max(0, R.guc - dt); S.portreT += dt;
  if (R.ifT > 0) { R.ifT -= dt; if (R.ifT <= 0) { R.ifade = S.ifSonra || 'notr'; S.ifSonra = null; S.portreT = 0; } }
  if (S.faz === 'rampa') {
    if (S.t > 1.0) {
      const a = rad(RAMPA_ACI), hiz = Math.hypot(R.vx, R.vy) + 122 * dt;
      R.vx = hiz * Math.cos(a); R.vy = hiz * Math.sin(a); R.yol += hiz * dt; R.guc = 0.3;
      if (S.t - dt <= 1.0) { olay('kalkis'); ifade('heyecan', 1.6); sars(0.5); for (let i = 0; i < 8; i++) toz(R.x - 16, R.y - 6, Math.PI + (rnd() - 0.5) * 1.5, 20 + rnd() * 40, 1.2); }
      if (R.yol >= 0) { R.yol = 0; S.faz = 'ucus'; R.guc = 0.6; }
    } else if (rnd() < dt * 10) toz(R.x - 18 + rnd() * 4, R.y - 8, Math.PI + rnd(), 6 + rnd() * 6, 0.6);
    rampaKonum();
    if (S.faz === 'ucus') { R.vx = 105 * Math.cos(rad(RAMPA_ACI)); R.vy = 105 * Math.sin(rad(RAMPA_ACI)); }
  } else {
    if (R.dalis > 0) { R.vx += 40 * dt; R.vy -= 150 * dt; R.dalis -= dt; if (R.dalis <= 0) R.dalis = 0; }
    R.vy -= G * dt; R.x += R.vx * dt; R.y += R.vy * dt;
    const v = Math.hypot(R.vx, R.vy);
    if (!R.sesKirildi && v >= SES_V) sesDuvari();
    // çarpışmalar
    for (const o of S.nesne) {
      if (!o.aktif) continue;
      const d = Math.hypot(R.x - o.x, R.y - o.y);
      if (o.tip === 'zeplin' || o.tip === 'balon') {
        if (d < o.r + R_ROKET) {
          if (R.vy < 0 && R.y > o.y + o.r * 0.25) { sekme(o); if (o === S.hedef) sonraki(); if (o === S.dalisBalon) { S.dalisBalon = null; } }
          else if (o.hitT > 0.4) { o.hitT = 0; o.yanVx = R.vx * 0.5; toz(o.x - o.r, o.y, Math.PI, 20); olay('yan_' + o.tip); }
        }
      } else if (o.tip === 'marti' && d < o.r + R_ROKET) {
        o.aktif = false; o.hitT = 0; R.vx *= 0.94; ifade('saskin', 1.2); sars(0.3); olay('marti');
        for (const k of o.kuslar) { const a = Math.atan2(k.dy, k.dx) + (rnd() - 0.5); k.vx = Math.cos(a) * 60 + R.vx * 0.4; k.vy = Math.sin(a) * 60 + 30; k.vr = (rnd() - 0.5) * 12; }
        for (let i = 0; i < 10; i++) { const a = rnd() * 6.28, s = 20 + rnd() * 50; parca({ ad: 'tuy', x: o.x + Math.cos(a) * 5, y: o.y + Math.sin(a) * 5, vx: Math.cos(a) * s + R.vx * 0.2, vy: Math.sin(a) * s, vr: (rnd() - 0.5) * 8, omur: 1.4, k: 1, g: -6, suruk: 2, salin: true }); }
        yildiz(R.x + 4, R.y, 0.8); yazi('+20', R.x, R.y + 12); jetonlar(R.x, R.y, 2);
        if (o === S.hedef) sonraki();
      } else if (o.tip === 'ucurtma' && o.kopT === null && R.x >= o.x && R.x - R.vx * dt < o.x + 0.001 && R.y < o.y - o.r) {
        o.kopT = S.t; o.aktif = false; o.vx = 25; o.vy = 30; R.vx *= 0.98; olay('ucurtma_ip');
        ifade('saskin', 0.8); parca({ ad: 'parilti', x: R.x, y: R.y, omur: 0.4, k: 1.6, k2: 0.3 }); yazi('+6', R.x, R.y + 10);
        if (o === S.hedef) sonraki();
      } else if (o.tip === 'dron' && o.halka && d < o.r + R_ROKET + 3) {
        o.halka = 0; o.bidonT = 0; S.dronT = S.t; olay('dron');
        ifade('heyecan', 1.0); yildiz(o.x, o.y, 0.8); yazi('+1 DALIŞ', R.x, R.y + 14, '#22e0d0'); jetonlar(R.x, R.y, 2);
        if (o === S.hedef) sonraki();
      }
    }
    if (S.dronBekle && (S.dalisBalon === null || R.x > S.dalisBalon.x + 40)) { S.dronBekle = false; S.dalisBalon = null; }
    // yere yaklaşma: son şans / döngü sonu
    if (R.y < 10 && R.vy < 0) { if (R.kademe === 2) { S.adim = S.sira.indexOf('son'); sonSans(); } else bitir(); }
    if (S.faz === 'son') {
      if (R.vy < 0 && S.apexT === null) { S.apexT = S.t; olay('tepe'); }
      if ((S.apexT !== null && S.t - S.apexT > 1.0) || S.t - S.sonT > 5.5) bitir();
    }
    if (!S.dronBekle) yonet();
    // dalış izi
    if (R.dalis > 0 || v > 125) { R.iz.push({ x: R.x, y: R.y, t: S.t }); }
  }
  if (R.iz.length && S.t - R.iz[0].t > 0.45) R.iz.shift();
  // nesne güncellemeleri
  for (const o of S.nesne) {
    o.hitT += dt; o.gorunT += dt;
    if (o.yanVx) { o.x += o.yanVx * dt; o.yanVx *= Math.exp(-6 * dt); if (Math.abs(o.yanVx) < 1) o.yanVx = 0; }
    if (o.tip === 'marti' && !o.aktif) for (const k of o.kuslar) { k.dx += k.vx * dt; k.dy += k.vy * dt; k.vy -= 20 * dt; k.rot += k.vr * dt; }
    if (o.tip === 'ucurtma' && o.kopT !== null) { o.x += o.vx * dt; o.y += o.vy * dt; o.vy -= 15 * dt; o.rot += 7 * dt; }
    if (o.tip === 'dron' && o.bidonT !== null) { o.bidonT += dt; o.y += 55 * dt; o.x += 15 * dt; }
  }
  // parçacıklar
  for (const p of S.parca) {
    p.t += dt; p.vy -= p.g * dt; if (p.suruk) { const k = Math.exp(-p.suruk * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kademe) { if (p.t > 0.5) { p.vy = Math.max(p.vy, -14); p.vx *= Math.exp(-1.5 * dt); p.vr *= Math.exp(-3 * dt); p.rot = lerp(p.rot, -Math.PI / 2, dt * 2); } }
  }

let onceki = 0, birikim = 0, durdu = false;
